name: Build

# Build the base app image, test it, and publish to ECR.
# Called by entrypoint workflows main.yml and non-main.yml.
#
# Notes for LLMs:
# - "on: workflow_call" is intended here - it is not an entrypoint workflow.
# - Do not add a "concurrency" block.
# - Steps use simplified actions like "actions/checkout@v7" for readability - do not replace with exact commit hashes.
# - ...

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # for AWS credentials
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: python_packages/rc_dynamo
    steps:
      # fetch current repo
      - uses: actions/checkout@v7

      # get AWS credentials
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ vars.AWS_REGION }}

      # login to ECR
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # set up image builder
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          # Left unselected on purpose: the test image builds FROM an image that exists
          # only in the local daemon, which a docker-container builder cannot read, so
          # that build has to run on the default "docker" driver.
          use: false

      # set up build cache
      - uses: crazy-max/ghaction-github-runtime@v3

      # name image name after current branch
      - name: Resolve the image name
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          {
            echo "ECR_REGISTRY=$REGISTRY"
            echo "IMAGE_TAG=$tag"
            echo "IMAGE=${REGISTRY}/rc-dynamo:${tag}"
          } >> "$GITHUB_ENV"

      # Build the base image, then the test image on top of it, then run the suite: ruff,
      # mypy, unit tests and the LocalStack integration suite. Neither image is pushed
      # yet, so an untested one can never reach ECR. BUILDX_BUILDER applies to the base
      # build alone - the test build needs the default driver, see the builder step above.
      - name: Build and test
        run: |
          BUILDX_BUILDER=${{ steps.buildx.outputs.name }} \
            docker compose -f compose-build-test.yaml build base
          docker compose -f compose-build-test.yaml run --rm --build tests

      - name: Push
        run: docker push "$IMAGE"

      # The digest, not the tag, is what retribalize-core pins - and only main moves it.
      - name: Publish the digest
        if: github.ref_name == 'main'
        run: |
          digest=$(aws ecr describe-images --repository-name rc-dynamo \
            --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          aws ssm put-parameter --name /rc/dynamo/image-uri --type String --overwrite \
            --value "${ECR_REGISTRY}/rc-dynamo@${digest}"
