AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize per-environment core resources (stack rc-env-<environment>):
  the durable buckets belonging to this environment. Deployed by
  `rc-infra apply`; do not deploy by hand.

# Conventions (rc-infra parses this file with yaml.safe_load):
#   - Long-form intrinsics only (Fn::Sub, Ref), never !Sub / !Ref.
#   - Every bucket is Retain. Deleting the stack never deletes data; rc-infra
#     empties and deletes preview buckets explicitly during teardown.
#   - Existing buckets are adopted with a CloudFormation import, which only
#     succeeds cleanly when the properties below match the live bucket.
#   - DynamoDB tables are NOT declared here. rc-dynamo-sync (retribalize-core)
#     owns their creation and schema.
#   - Cognito is NOT declared here. The pools are shared by several environments
#     (all previews use one), so they belong to rc-platform, not to any one
#     environment. See infra/identity.md.
#   - No NotificationConfiguration on UserCorpusBucket. retribalize-core's
#     setup_corpus_triggers.py owns that bucket's notifications.

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9]{1,19}$"

Resources:
  EmbeddingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-embeddings-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # rc-prod-embeddings already carries this rule and the other environments do
      # not. Declaring it matches prod exactly -- so adopting prod changes nothing --
      # and adds a rule elsewhere that grants no access on a bucket whose public
      # access is blocked.
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  UserCorpusBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-user-corpus-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT]
            AllowedOrigins: ["*"]

  # The one public bucket. It serves avatars, project banners, user galleries, blog
  # covers and event photos straight to browsers through a bucket policy granting
  # s3:GetObject on those prefixes. The policy itself is NOT declared here: its
  # statement list differs per environment, and it is a separate resource that the
  # import leaves alone.
  #
  # Public access must therefore stay unblocked. Setting BlockPublicPolicy would
  # reject that policy and every image in the product would stop loading.
  AvatarsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-avatars-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-recordings-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SchemaDumpsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-schema-dumps-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSchemaDumps
            Status: Enabled
            ExpirationInDays: 30

  # Durable per-environment registry of property definitions. Versioned, because a
  # definition that is overwritten by mistake has to be recoverable. It exists today
  # for prod, staging, dev and preview89; the rest are created.
  PropertyRegistryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: "rc-${EnvironmentName}-property-registry-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
