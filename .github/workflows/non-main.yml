name: Non-main

# Entrypoint for pushes to every branch except main: validate.yml, then deploy-images.yml.
# Never deploys infrastructure; a branch reaches AWS only to push its own image tag.
#
# Notes for LLMs:
# - Do not change the "on" directive; main.yml and non-main.yml split pushes so exactly one runs.
# - Keep the concurrency group different from every called workflow's; an identical group deadlocks and cancels the run.
# - Grant id-token here, on the calling job; a called workflow can only downgrade permissions.
# - A "uses" job takes only name, uses, with, secrets, strategy, needs, if, concurrency and permissions.
# - ...

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  # one pipeline per branch; replace stale runs on the same branch
  group: re-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Deleting a branch is also a push, but one whose diff is meaningless: "before" is
    # the deleted tip while the run's SHA reverts to the default branch.
    if: ${{ !github.event.deleted }}
    uses: ./.github/workflows/validate.yml

  deploy-images:
    if: ${{ !github.event.deleted }}
    needs: validate
    permissions:
      contents: read
      # for AWS credentials: every branch publishes its image under its own tag
      id-token: write
    uses: ./.github/workflows/deploy-images.yml
