[project]
name = "rc-dynamo"
version = "0.1.0"
description = "Retribalize generic DynamoDB framework: declarative items and tables plus schema tooling."
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43.36",
    "pydantic>=2,<3",
]

[project.scripts]
rc-dynamo-sync = "rc_dynamo.cli:sync_main"
rc-dynamo-report = "rc_dynamo.cli:report_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rc_dynamo"]

# No dependency group here on purpose: everything this project locks ends up in the
# published image. Test and lint tooling lives in tests/pyproject.toml.
#
# The tool config below is shared: tests/pyproject.toml extends it, and mypy is run
# from this directory.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
