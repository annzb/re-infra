# Desired state of every Retribalize deployment environment.
#
# Adding an entry creates its rc-env-<name> stack on merge to main.
# Removing an entry DELETES the environment on merge: its app stack, its
# schema-sync tables, its buckets and their data. prod, staging and dev can
# never be removed. Field reference: README.md.

schema_version: 1
account_id: "273268178059"
region: us-east-1

# One Cognito user pool, app client and hosted UI domain per profile, in the
# rc-identity stack (infra/identity.yaml). An environment uses the profile of the
# same name if there is one, otherwise "preview". Their IDs are stack outputs:
# `rc-infra outputs`.
identity_profiles:
  prod: {}
  staging: {}
  dev: {}
  preview: {}

environments:
  prod: {}
  staging: {}
  dev: {}

  preview1: {}
  preview2: {}
  preview3: {}
  preview4: {}
  preview5: {}
  preview6: {}
  preview7: {}
  preview8: {}
  preview67: {}
  preview89: {}
