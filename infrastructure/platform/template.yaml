AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize shared platform resources (stack rc-platform): the Lambda base
  image repository and its BuildKit cache. Deployed by `rc-infra apply`.

# The current base-image digest is published to SSM (/rc/lambda-base/image-uri)
# by .github/workflows/lambda-base.yml, not by this stack, so every build does
# not register as drift.

Resources:
  LambdaBaseRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: rc-lambda-base
      # Build tags are immutable; only the convenience tag "latest" may move.
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 30 days; tagged builds are kept for rollback",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

  LambdaBaseCacheRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: rc-lambda-base-cache
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged cache manifests after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              }
            ]
          }

Outputs:
  LambdaBaseRepositoryUri:
    Value:
      Fn::GetAtt: [LambdaBaseRepository, RepositoryUri]
  LambdaBaseCacheRepositoryUri:
    Value:
      Fn::GetAtt: [LambdaBaseCacheRepository, RepositoryUri]
