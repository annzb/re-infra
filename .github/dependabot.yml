version: 2

# Updates arrive as pull requests and go through the same review and plan as any other change.
# Never enable auto-merge here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /python_packages/rc_dynamo
    schedule:
      interval: weekly

  # The test project locks its tooling separately from the published package.
  - package-ecosystem: uv
    directory: /python_packages/rc_dynamo/tests
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /python_packages/rc_dynamo
    schedule:
      interval: weekly
