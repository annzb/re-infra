name: Build

# Build the Lambda parent image and test it. Publish to ECR only if the tests pass.
# Called by main.yml with publish: true and by non-main.yml with publish: false.
# - build (all branches): build image tarball as a workflow artifact (no AWS access).
# - test (all branches): run unit and integration tests inside the built image.
# - publish (main branch only): push rc-lambda-base:latest to ECR, then write its digest to SSM.

on:
  workflow_call:
    inputs:
      publish:
        description: Allow pushing the tested image to ECR. Only true for main.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # prevent simultaneous builds from the same branch while allowing different branches in parallel
  group: build-${{ github.ref }}
  # replace stale builds on feature branches, but always allow a running main build to finish
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_ARTIFACT_NAME: rc-lambda-base-image
  IMAGE_TAG: rc-lambda-base:ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: images/lambda-base
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/rc-lambda-base.tar

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: /tmp/rc-lambda-base.tar
          retention-days: 1
          compression-level: 0

  test:
    name: Test suites and image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: images/lambda-base
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DYNAMO_SCHEMA_TEST_PREFIX: rc-ci-schema-sync-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: |
          uv lock --check
          uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests (LocalStack)
        run: uv run pytest tests/integration

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: /tmp

      # The published image must hold the package and console scripts, and must not
      # hold the test tooling.
      - name: Smoke test the built image
        run: |
          docker load --input /tmp/rc-lambda-base.tar
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            "import sys, rc_lambda_base, rc_lambda_base.dynamo.cli; assert sys.version_info[:2] == (3, 11)"
          docker run --rm --entrypoint rc-dynamo-sync "$IMAGE_TAG" --help
          docker run --rm --entrypoint rc-dynamo-report "$IMAGE_TAG" --help
          if docker run --rm --entrypoint python "$IMAGE_TAG" -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is installed in the published image"
            exit 1
          fi

  publish:
    name: Publish to ECR
    needs: [build, test]
    # true only when main.yml is the caller
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/rc-lambda-base.tar

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # One mutable tag, overwritten every time. Docker skips the layers the registry
      # already holds, so re-pushing an unchanged image costs almost nothing.
      - name: Push latest
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          repository="${REGISTRY}/rc-lambda-base"
          docker tag "$IMAGE_TAG" "${repository}:latest"
          docker push "${repository}:latest"
          digest=$(aws ecr describe-images --repository-name rc-lambda-base \
            --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "repository=$repository"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      # The digest, not the tag, is what retribalize-core pins.
      - name: Publish the digest
        env:
          REPOSITORY: ${{ steps.push.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          aws ssm put-parameter --name /rc/lambda-base/image-uri --type String --overwrite \
            --value "${REPOSITORY}@${DIGEST}"
          {
            echo "## Lambda base image published"
            echo ""
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin in retribalize-core: \`${REPOSITORY}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
