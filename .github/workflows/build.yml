name: Build

# Build the Lambda parent image, test it, and publish it to ECR.
# Called by entrypoint workflows main.yml and non-main.yml.
#
# Notes for LLMs:
# - "on: workflow_call" is intended here - it is not an entrypoint workflow.
# - Do not add a "concurrency" block.
# - Steps use simplified actions like "actions/checkout@v7" for readability - do not replace with exact commit hashes.
# - ...

on:
  workflow_call:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # for AWS credentials
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: images/lambda-base
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      # fetch current repo
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # install uv
      - uses: astral-sh/setup-uv@v10
        with:
          # uv-specific cache
          enable-cache: true

      # install python dependencies
      - name: Install
        run: |
          uv lock --check
          uv sync --frozen

      # ruff for code format, mypy for type checking
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      # These variables belong to this step alone. At job level, AWS_ENDPOINT_URL and
      # the dummy credentials would redirect the ECR and SSM calls below at LocalStack.
      - name: Integration tests (LocalStack)
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          DYNAMO_SCHEMA_TEST_PREFIX: rc-ci-schema-sync-test
        run: uv run pytest tests/integration

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # setup image builder
      - uses: docker/setup-buildx-action@v4

      # One moving tag per branch, plus "latest" for main. A ref such as "feature/x"
      # is not a legal Docker tag, so anything outside [A-Za-z0-9_.-] becomes a dash.
      - name: Resolve image tags
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          repository="${REGISTRY}/rc-lambda-base"
          tag=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          tags="${repository}:${tag}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tags="${tags},${repository}:latest"
          fi
          {
            echo "repository=$repository"
            echo "tag=$tag"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      # Loaded, not pushed: the smoke test below runs first, so an untested image can
      # never reach ECR.
      - uses: docker/build-push-action@v7
        with:
          context: images/lambda-base
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # The published image must hold the package and console scripts, and must not
      # hold the test tooling.
      - name: Smoke test the built image
        env:
          IMAGE: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import sys, rc_lambda_base, rc_lambda_base.dynamo.cli; assert sys.version_info[:2] == (3, 11)"
          docker run --rm --entrypoint rc-dynamo-sync "$IMAGE" --help
          docker run --rm --entrypoint rc-dynamo-report "$IMAGE" --help
          if docker run --rm --entrypoint python "$IMAGE" -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is installed in the published image"
            exit 1
          fi

      - name: Push
        id: push
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${REPOSITORY}:${TAG}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker push "${REPOSITORY}:latest"
          fi
          digest=$(aws ecr describe-images --repository-name rc-lambda-base \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The digest, not the tag, is what retribalize-core pins - and only main moves it.
      - name: Publish the digest
        env:
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Lambda base image published"
            echo ""
            echo "- Tag: \`${REPOSITORY}:${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Branch build: /rc/lambda-base/image-uri is left unchanged."
            exit 0
          fi
          aws ssm put-parameter --name /rc/lambda-base/image-uri --type String --overwrite \
            --value "${REPOSITORY}@${DIGEST}"
          echo "- Pin in retribalize-core: \`${REPOSITORY}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
