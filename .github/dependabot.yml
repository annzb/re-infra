version: 2

# Updates arrive as pull requests and go through the same review and plan as any other change.
# Never enable auto-merge here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /images/lambda-base
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /images/lambda-base
    schedule:
      interval: weekly
