[project]
name = "rc-infra"
version = "0.1.0"
description = "Retribalize environment catalog and infrastructure deployment tooling"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3>=1.43.36",
  "pydantic>=2,<3",
  "PyYAML>=6.0.2",
]

[project.scripts]
rc-infra = "rc_infra.cli:main"

[dependency-groups]
dev = [
  "boto3-stubs[cloudformation,dynamodb,s3,sts]",
  "cfn-lint>=1.0",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rc_infra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
