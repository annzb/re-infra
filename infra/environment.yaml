AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize per-environment core resources (stack rc-env-<environment>):
  the durable buckets belonging to this environment. Deployed by
  `rc-infra apply`; do not deploy by hand.

# Conventions (rc-infra parses this file with yaml.safe_load):
#   - Long-form intrinsics only (Fn::Sub, Ref), never !Sub / !Ref.
#   - Every bucket is RetainExceptOnCreate. Deleting the stack never deletes data;
#     rc-infra empties and deletes preview buckets explicitly during teardown. A
#     first create that rolls back removes the (still empty) buckets it made.
#   - No BucketName: CloudFormation generates rc-env-<environment>-<logical id>-<suffix>,
#     which teardown relies on. Callers read the names from the outputs below
#     (`rc-infra outputs`), never reconstruct them.
#   - DynamoDB tables are NOT declared here. rc-dynamo-sync (retribalize-core)
#     owns their creation and schema.
#   - Cognito is NOT declared here. The pools are shared by several environments
#     (all previews use one), so they belong to rc-identity. See infra/identity.md.
#   - No NotificationConfiguration on UserCorpusBucket. retribalize-core's
#     setup_corpus_triggers.py owns that bucket's notifications.

Resources:
  EmbeddingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  UserCorpusBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT]
            AllowedOrigins: ["*"]

  # The one public bucket. AvatarsBucketPolicy below serves its public prefixes
  # straight to browsers; everything else in it stays private and is read through
  # presigned URLs (retribalize-core aws_utils/s3.py presign_get).
  #
  # Public access must therefore stay unblocked. Setting BlockPublicPolicy would
  # reject that policy and every image in the product would stop loading.
  AvatarsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  # Public read on exactly the prefixes retribalize-core serves by plain URL. The old
  # per-environment policies also opened event-photos/, project-documents/ and (on
  # preview) residency-photos/, which core itself treats as private and presigns, so
  # they stay private here: no feature depends on them being public.
  AvatarsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket:
        Ref: AvatarsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - Fn::Sub: "${AvatarsBucket.Arn}/avatars/*"
              - Fn::Sub: "${AvatarsBucket.Arn}/project-banners/*"
              - Fn::Sub: "${AvatarsBucket.Arn}/project-galleries/*"
              - Fn::Sub: "${AvatarsBucket.Arn}/user-banners/*"
              - Fn::Sub: "${AvatarsBucket.Arn}/user-galleries/*"
              - Fn::Sub: "${AvatarsBucket.Arn}/blog-covers/*"

  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SchemaDumpsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSchemaDumps
            Status: Enabled
            ExpirationInDays: 30

  # Durable per-environment registry of property definitions. Versioned, because a
  # definition that is overwritten by mistake has to be recoverable.
  PropertyRegistryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            # As on the live registry buckets (core's creation script set it).
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

Outputs:
  EmbeddingsBucketName:
    Value:
      Ref: EmbeddingsBucket
  EmbeddingsBucketArn:
    Value:
      Fn::GetAtt: [EmbeddingsBucket, Arn]
  UserCorpusBucketName:
    Value:
      Ref: UserCorpusBucket
  UserCorpusBucketArn:
    Value:
      Fn::GetAtt: [UserCorpusBucket, Arn]
  AvatarsBucketName:
    Value:
      Ref: AvatarsBucket
  AvatarsBucketArn:
    Value:
      Fn::GetAtt: [AvatarsBucket, Arn]
  RecordingsBucketName:
    Value:
      Ref: RecordingsBucket
  RecordingsBucketArn:
    Value:
      Fn::GetAtt: [RecordingsBucket, Arn]
  SchemaDumpsBucketName:
    Value:
      Ref: SchemaDumpsBucket
  SchemaDumpsBucketArn:
    Value:
      Fn::GetAtt: [SchemaDumpsBucket, Arn]
  PropertyRegistryBucketName:
    Value:
      Ref: PropertyRegistryBucket
  PropertyRegistryBucketArn:
    Value:
      Fn::GetAtt: [PropertyRegistryBucket, Arn]
