[project]
name = "rc-lambda-base"
version = "0.1.0"
description = "Retribalize Lambda base package: generic DynamoDB framework and schema tooling."
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.43.36",
    "pydantic>=2,<3",
]

[project.scripts]
rc-dynamo-sync = "rc_lambda_base.dynamo.cli:sync_main"
rc-dynamo-report = "rc_lambda_base.dynamo.cli:report_main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rc_lambda_base"]

[tool.pytest.ini_options]
# Unit tests by default. The LocalStack suite runs explicitly:
#   uv run pytest tests/integration
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
