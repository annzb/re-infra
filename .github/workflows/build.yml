name: Build base image

# Builds the Lambda parent image, hands it to test.yml, and publishes it only after
# those tests pass. The image is passed between jobs as a workflow artifact, so an
# untested image never reaches ECR and the build itself needs no AWS credentials.

on:
  push:
    branches: [main]
    paths:
      - images/lambda-base/**
      - .github/workflows/build.yml
      - .github/workflows/test.yml
  pull_request:
    paths:
      - images/lambda-base/**
      - .github/workflows/build.yml
      - .github/workflows/test.yml
  # Weekly rebuild picks up patched upstream base layers.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-lambda-base-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ARTIFACT_NAME: rc-lambda-base-image
  IMAGE_TAG: rc-lambda-base:ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/lambda-base
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/rc-lambda-base.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/rc-lambda-base.tar
          retention-days: 1
          compression-level: 0

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      artifact: rc-lambda-base-image
      image_tag: rc-lambda-base:ci

  publish:
    name: Publish to ECR
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/rc-lambda-base.tar

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      # Immutable: the repository rejects overwriting an existing build tag.
      - name: Push build tag
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          repository="${REGISTRY}/rc-lambda-base"
          docker tag "$IMAGE_TAG" "${repository}:${tag}"
          docker push "${repository}:${tag}"
          digest=$(aws ecr describe-images --repository-name rc-lambda-base \
            --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "repository=$repository"
            echo "tag=$tag"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Scan
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          aws ecr wait image-scan-complete --repository-name rc-lambda-base \
            --image-id imageDigest="$DIGEST"
          critical=$(aws ecr describe-image-scan-findings --repository-name rc-lambda-base \
            --image-id imageDigest="$DIGEST" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          echo "CRITICAL findings: $critical"
          # Documented threshold: any CRITICAL finding fails the publish.
          if [ "$critical" != "None" ] && [ "$critical" != "0" ]; then
            echo "::error::$critical CRITICAL findings in rc-lambda-base@$DIGEST"
            exit 1
          fi

      - name: Move latest and publish the digest
        env:
          REPOSITORY: ${{ steps.push.outputs.repository }}
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker tag "$IMAGE_TAG" "${REPOSITORY}:latest"
          docker push "${REPOSITORY}:latest"
          aws ssm put-parameter --name /rc/lambda-base/image-uri --type String --overwrite \
            --value "${REPOSITORY}@${DIGEST}"
          {
            echo "## Lambda base image published"
            echo ""
            echo "- Build tag: \`${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin in retribalize-core: \`${REPOSITORY}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
