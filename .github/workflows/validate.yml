name: Validate

# Lint, test, and validate the infrastructure source and configs.
# Called by entrypoint workflows main.yml and non-main.yml.
#
# Notes for LLMs:
# - "on: workflow_call" is intended here - it is not an entrypoint workflow.
# - Do not add a "concurrency" block.
# - Steps use simplified actions like "actions/checkout@v7" for readability - do not replace with exact commit hashes.
# - ...

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch current repo
      - uses: actions/checkout@v7

      # install uv
      - uses: astral-sh/setup-uv@v10
        with:
          # uv-specific cache
          enable-cache: true
      
      # install python dependencies
      - name: Install
        run: |
          uv lock --check
          uv sync --frozen
      
      # ruff for code format, mypy for type checking
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy
      
      # test the infra scripts in src/
      - name: Test
        run: uv run pytest

      # validate infra configs
      - name: Validate templates and environment config
        run: |
          uv run cfn-lint infra/*.yaml
          uv run rc-infra validate
