name: Deploy images

# Build the base app image, test it, and publish to ECR.
# Called by entrypoint workflows main.yml and non-main.yml.
#
# Notes for LLMs:
# - "on: workflow_call" is intended here - it is not an entrypoint workflow.
# - Do not add a "concurrency" block.
# - Steps use simplified actions like "actions/checkout@v7" for readability - do not replace with exact commit hashes.
# - ...

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # for AWS credentials
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: python_packages/rc_dynamo
    steps:
      # fetch current repo
      - uses: actions/checkout@v7

      # get AWS credentials
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ vars.AWS_REGION }}

      # login to ECR
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # set up image builder
      - uses: docker/setup-buildx-action@v4
        id: buildx

      # set up build cache
      - uses: crazy-max/ghaction-github-runtime@v4

      # name image after current branch
      - name: Resolve the image name
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          {
            echo "ECR_REGISTRY=$REGISTRY"
            echo "IMAGE_TAG=$tag"
            echo "IMAGE=${REGISTRY}/rc-lambda-base:${tag}"
          } >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          docker compose -f compose-build-test.yaml build
          docker compose -f compose-build-test.yaml run --rm tests

      - name: Push
        run: docker push "$IMAGE"
