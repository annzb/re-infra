name: Deploy environments

# INFRASTRUCTURE ONLY. This applies envs.yaml to AWS: rc-platform, one rc-env-<name>
# stack per entry in it (created, imported, or updated), and teardown of environments
# removed from it.
#
# It never deploys an application. The rc-app-<name> stacks belong to
# retribalize-core, which reads what this publishes under /rc/env/<name>/.
#
# Called by main.yml only, after validate.yml passes. `apply` prints the plan it is
# about to run, so the job log always records what changed.

on:
  workflow_call:

permissions:
  contents: read

# One infrastructure apply at a time; never cancel one midway.
concurrency:
  group: re-infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  apply:
    name: Apply the environment config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      RC_INFRA_CFN_ROLE_ARN: ${{ vars.AWS_ROLE_CFN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The full suite already ran in validate.yml; this is the cheap last check that
      # what is about to be applied is well formed.
      - name: Validate templates and environment config
        run: |
          uv run cfn-lint infra/*.yaml
          uv run rc-infra validate

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      # Prints the plan, refuses it if anything is BLOCKED, then applies it.
      - name: Apply
        run: uv run rc-infra apply --yes
