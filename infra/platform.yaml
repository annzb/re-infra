AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize shared platform resources (stack rc-platform): the repository for
  the Lambda base image built from python_packages/rc_dynamo. Deployed by
  `rc-infra apply`.

# The current base-image digest is published to SSM (/rc/dynamo/image-uri)
# by .github/workflows/build.yml, not by this stack, so every build does not
# register as drift.

Resources:
  DynamoImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: rc-dynamo
      # Every tag moves: one tag per branch, rewritten on each push to that branch.
      # Immutable identity comes from the digest.
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 30 days; tagged builds are kept for rollback",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

Outputs:
  DynamoImageRepositoryUri:
    Value:
      Fn::GetAtt: [DynamoImageRepository, RepositoryUri]
