name: Build

# Build the Lambda parent image, test it, and publish it to ECR.
# Called by entrypoint workflows main.yml and non-main.yml.
#
# Notes for LLMs:
# - "on: workflow_call" is intended here - it is not an entrypoint workflow.
# - Do not add a "concurrency" block.
# - Steps use simplified actions like "actions/checkout@v7" for readability - do not replace with exact commit hashes.
# - ...

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # for AWS credentials
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: python_packages/rc_dynamo
    steps:
      # fetch current repo
      - uses: actions/checkout@v7

      # get AWS credentials
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_GITHUB }}
          aws-region: ${{ vars.AWS_REGION }}

      # login to ECR
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Set up a container-driver builder for the image build (it is what supports the
      # gha cache), but leave it unselected: the compose build below layers onto an
      # image that exists only in the local daemon, which only the default "docker"
      # driver can see.
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false

      # named image tag after current branch
      - name: Resolve the image tag
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          {
            echo "REGISTRY=$ECR_REGISTRY"
            echo "IMAGE_TAG=$tag"
            echo "IMAGE=${ECR_REGISTRY}/rc-dynamo:${tag}"
          } >> "$GITHUB_ENV"

      # Loaded, not pushed: the tests and the smoke test below run first, so an
      # untested image can never reach ECR.
      - uses: docker/build-push-action@v7
        with:
          # This input is repo-root-relative and ignores the job's working-directory.
          context: python_packages/rc_dynamo
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ env.IMAGE }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # ruff, mypy, unit tests and the LocalStack integration suite, against the image
      # that was just built: compose resolves its base image from REGISTRY and IMAGE_TAG,
      # so only the thin test layer is built here.
      - name: Test
        run: docker compose -f compose-tests.yaml run --rm --build tests

      - name: Tear down the test stack
        if: always()
        run: docker compose -f compose-tests.yaml down -v

      # The published image must hold the package and console scripts, and must not
      # hold the test tooling.
      - name: Smoke test the built image
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import sys, rc_dynamo, rc_dynamo.cli; assert sys.version_info[:2] == (3, 11)"
          docker run --rm --entrypoint rc-dynamo-sync "$IMAGE" --help
          docker run --rm --entrypoint rc-dynamo-report "$IMAGE" --help
          if docker run --rm --entrypoint python "$IMAGE" -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is installed in the published image"
            exit 1
          fi

      - name: Push
        id: push
        run: |
          docker push "$IMAGE"
          digest=$(aws ecr describe-images --repository-name rc-dynamo \
            --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The digest, not the tag, is what retribalize-core pins - and only main moves it.
      - name: Publish the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Lambda base image published"
            echo ""
            echo "- Tag: \`${IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Branch build: /rc/dynamo/image-uri is left unchanged."
            exit 0
          fi
          aws ssm put-parameter --name /rc/dynamo/image-uri --type String --overwrite \
            --value "${REGISTRY}/rc-dynamo@${DIGEST}"
          echo "- Pin in retribalize-core: \`${REGISTRY}/rc-dynamo@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
