name: Main

# Entrypoint for pushes to main: validate.yml, then deploy-infra.yml, then deploy-images.yml.
# The only workflow that changes infrastructure.
#
# Notes for LLMs:
# - Do not modify this workflow without explicit permission from the repository owner.
# - Do not change the "on" directive; main.yml and non-main.yml split pushes so exactly one runs.
# - Keep the concurrency group different from every called workflow's; an identical group deadlocks and cancels the run.
# - Grant id-token here, on the calling job; a called workflow can only downgrade permissions.
# - A "uses" job takes only name, uses, with, secrets, strategy, needs, if, concurrency and permissions.
# - ...

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # one pipeline per branch, and never cancel a deployment that is already running
  group: re-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # deliberately no id-token: validation never touches AWS
    uses: ./.github/workflows/validate.yml

  deploy-infra:
    needs: validate
    permissions:
      contents: read
      # for AWS credentials
      id-token: write
    uses: ./.github/workflows/deploy-infra.yml

  deploy-images:
    # runs after the environments exist, so a published image always matches live infrastructure
    needs: [validate, deploy-infra]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-images.yml
