AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize shared platform resources (stack rc-platform): the container image
  repositories and the shared Lambda execution role. Everything here is shared
  by every environment. Deployed by `rc-infra apply`; do not deploy by hand.

# Conventions (rc-infra parses this file with yaml.safe_load):
#   - Long-form intrinsics only (Fn::GetAtt with a list, Ref), never !GetAtt.
#   - Everything here is Retain. Deleting the stack must never delete an image a
#     deployed Lambda is running.
#   - Cognito is NOT declared here; it is the rc-identity stack (identity.yaml).
#   - The repository names are fixed because image builds address them by name.
#     None of them collides with retribalize-core's rc-ecr repositories (rc-api,
#     rc-matching), which keep serving deployed Lambdas until core is repointed.
#   - The role has no RoleName: CloudFormation generates it, and callers read
#     SharedLambdaExecutionRoleArn from the stack outputs.

Resources:
  # The Python 3.11 Lambda parent image built from python_packages/rc_dynamo.
  LambdaBaseImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: rc-lambda-base
      # Every tag moves: one tag per branch, rewritten on each push to that branch.
      # Immutable identity comes from the digest.
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Safe here precisely because tags move: an untagged image in this
      # repository is one a later branch build superseded. The two service
      # repositories below deliberately have no equivalent rule.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 30 days; tagged builds are kept for rollback",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

  # The API image. retribalize-core builds it and deploys it BY DIGEST through
  # its ApiImageUri parameter, so a live Lambda's image is normally untagged --
  # an untagged-expiry rule here would delete an image that is running. The only
  # tag it carries is the mutable "buildcache" layer cache, which nothing deploys.
  # There is no lifecycle policy on purpose: an old image is what a rollback needs.
  ApiImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: rc-api-v2
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

  # The one image every matching Lambda shares, deployed by digest through
  # retribalize-core's MatchingImageUri parameter. No lifecycle policy, for the
  # same reason as rc-api-v2.
  MatchingImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: rc-matching-v2
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer

  # ── Shared Lambda execution role ────────────────────────────────────
  # The execution role retribalize-core's application Lambdas run as, supplied to
  # its stack as the SharedLambdaExecutionRoleArn output.
  SharedLambdaExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Shared execution role for Retribalize application Lambda functions.
      Path: /
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/PowerUserAccess
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com

Outputs:
  LambdaBaseImageRepositoryUri:
    Value:
      Fn::GetAtt: [LambdaBaseImageRepository, RepositoryUri]
  ApiImageRepositoryUri:
    Value:
      Fn::GetAtt: [ApiImageRepository, RepositoryUri]
  MatchingImageRepositoryUri:
    Value:
      Fn::GetAtt: [MatchingImageRepository, RepositoryUri]
  SharedLambdaExecutionRoleArn:
    Value:
      Fn::GetAtt: [SharedLambdaExecutionRole, Arn]
