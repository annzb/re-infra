# Builds the rc-dynamo images and runs the whole gate against them: ruff, mypy, unit
# tests, and the LocalStack-backed schema-sync integration suite. The steps themselves
# live in tests/run-checks.sh, so CI and a laptop run exactly the same thing.
#
#   BUILD_CACHE_TO=type=inline docker compose -f compose-build-test.yaml build
#   docker compose -f compose-build-test.yaml run --rm tests
#   docker compose -f compose-build-test.yaml down -v
#
# "tests" takes the core image through the "rc_dynamo_base" build context rather than by
# name, so the two builds are one linked graph: nothing round-trips through the local
# image store, one builder does both, and the suite runs against the exact bits that get
# pushed. That is why "docker compose build" builds both and why neither build needs a
# particular buildx driver.
#
# BUILD_CACHE_TO is there because a laptop on the default "docker" driver cannot export
# any cache but inline, while CI wants the GitHub Actions cache. BUILD_CACHE_FROM needs
# no override: importing a gha cache without an Actions token is a silent no-op.
name: rc-dynamo-build-test

# The name the published image is pushed under. CI exports ECR_REGISTRY and IMAGE_TAG
# from deploy-images.yml; the defaults are what a laptop gets. Only "base" needs it - the test
# image is wired to that build directly and never resolves a name.
x-image-ref: &image-ref ${ECR_REGISTRY:-273268178059.dkr.ecr.us-east-1.amazonaws.com}/rc-dynamo:${IMAGE_TAG:-latest}

services:
  # The published Lambda parent image. It exists to be built, never started: it is a
  # runtime-interface image with no command of its own, and nothing depends_on it, so
  # "run tests" leaves it alone.
  base:
    image: *image-ref
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      cache_from: ["${BUILD_CACHE_FROM:-type=gha,scope=rc-dynamo-base}"]
      cache_to: ["${BUILD_CACHE_TO:-type=gha,mode=max,scope=rc-dynamo-base}"]

  localstack:
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,dynamodb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  tests:
    # linux/amd64 throughout, matching the core image and Lambda. On an arm64 host
    # this runs emulated.
    platform: linux/amd64
    build:
      context: .
      dockerfile: tests.Dockerfile
      platforms:
        - linux/amd64
      # Hands the "base" build's output to tests.Dockerfile's "FROM rc_dynamo_base",
      # which is what links the two builds into one graph.
      additional_contexts:
        rc_dynamo_base: service:base
      cache_from: ["${BUILD_CACHE_FROM:-type=gha,scope=rc-dynamo-tests}"]
      cache_to: ["${BUILD_CACHE_TO:-type=gha,mode=max,scope=rc-dynamo-tests}"]
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      # The integration suite refuses to run against anything but LocalStack.
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DYNAMO_SCHEMA_TEST_PREFIX: ${DYNAMO_SCHEMA_TEST_PREFIX:-rc-local-schema-sync-test}
