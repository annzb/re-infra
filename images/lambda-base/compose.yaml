# LocalStack for the schema-sync integration suite:
#   docker compose up -d --wait
#   AWS_ENDPOINT_URL=http://localhost:4566 AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
#   AWS_REGION=us-east-1 DYNAMO_SCHEMA_TEST_PREFIX=rc-local-schema-sync-test \
#   uv run pytest tests/integration
#   docker compose down
name: rc-lambda-base-tests

services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,dynamodb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
