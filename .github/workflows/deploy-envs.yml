name: Deploy environments

# INFRASTRUCTURE ONLY. This applies environments/catalog.yaml to AWS: rc-platform,
# one rc-env-<name> stack per catalog entry (created, imported, or updated), and
# teardown of environments removed from the catalog.
#
# It never deploys an application. The rc-app-<name> stacks belong to
# retribalize-core, which reads what this publishes under /rc/env/<name>/.
#
# Called by validate.yml, for main only, after validation and the plan pass.

on:
  workflow_call:

permissions:
  contents: read

# One infrastructure apply at a time; never cancel one midway.
concurrency:
  group: re-infra-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Apply the environment catalog
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      RC_INFRA_CFN_ROLE_ARN: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The full suite already ran in the calling workflow's validate job; this is
      # the cheap last check that what is about to be applied is well formed.
      - name: Validate templates and catalog
        run: |
          uv run cfn-lint infra/*.yaml
          uv run rc-infra validate

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Recorded in the run summary, then applied. Refuses to apply anything BLOCKED.
      - name: Plan
        run: uv run rc-infra plan --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: uv run rc-infra apply --yes
