AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize infrastructure bootstrap (stack rc-bootstrap): IAM roles that let
  GitHub Actions in the re-infra repository apply infrastructure.
  Deployed manually, once, by an administrator (see README.md "One-time setup").

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub owner of the infrastructure repository.
  GitHubRepo:
    Type: String
    Default: re-infra
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      An account can hold only one GitHub OIDC provider. retribalize-core already
      uses one in this account, so leave this false unless it does not exist.

Conditions:
  ShouldCreateOidcProvider:
    Fn::Equals: [Ref: CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Used by CloudFormation itself for every stack rc-infra deploys or deletes.
  # PowerUserAccess is required because teardown deletes rc-app-<env> stacks,
  # which contain Lambda, API Gateway, SQS, CloudFront, and log resources.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rc-infra-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: app-stack-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/rc-app-*"

  # The only role GitHub Actions assumes. Any branch may assume it, because build.yml
  # publishes an image tag from every branch; only main.yml routes it into a deploy.
  # The denies below are what keep a branch from reaching protected environments.
  GitHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rc-infra-github
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*"
      Policies:
        - PolicyName: github
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStacks
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: ManageOwnedStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:UpdateTerminationProtection
                Resource:
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-env-*/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-platform/*"
              - Sid: DeleteRemovedAppStacks
                Effect: Allow
                Action: cloudformation:DeleteStack
                Resource:
                  Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-app-*/*"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt: [CloudFormationExecutionRole, Arn]
              - Sid: BucketsConfigurationAndTeardown
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetBucketCORS
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:DeleteBucket
                Resource:
                  - "arn:aws:s3:::rc-*"
                  - "arn:aws:s3:::rc-*/*"
              - Sid: ReadTables
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:ListTagsOfResource
                Resource:
                  Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rc-*"
              - Sid: ListTables
                Effect: Allow
                Action: dynamodb:ListTables
                Resource: "*"
              - Sid: DeleteSchemaSyncTables
                Effect: Allow
                Action: dynamodb:DeleteTable
                Resource:
                  Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rc-*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ManagedBy: rc-dynamo-sync
              # Defense in depth: rc-infra refuses these too, but IAM makes it impossible.
              - Sid: NeverDestroyProtectedEnvironments
                Effect: Deny
                Action:
                  - cloudformation:DeleteStack
                  - s3:DeleteBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - dynamodb:DeleteTable
                Resource:
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-env-prod/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-env-staging/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-env-dev/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-app-prod/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-app-staging/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-app-dev/*"
                  - Fn::Sub: "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/rc-platform/*"
                  - "arn:aws:s3:::rc-prod-*"
                  - "arn:aws:s3:::rc-staging-*"
                  - "arn:aws:s3:::rc-dev-*"
                  - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rc-prod-*"
                  - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rc-staging-*"
                  - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rc-dev-*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushLambdaBaseImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/rc-lambda-base"
              - Sid: PublishLambdaBaseDigest
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource:
                  Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rc/lambda-base/*"

Outputs:
  GitHubRoleArn:
    Description: Repository variable AWS_ROLE_GITHUB
    Value:
      Fn::GetAtt: [GitHubRole, Arn]
  CloudFormationExecutionRoleArn:
    Description: Repository variable AWS_ROLE_CFN
    Value:
      Fn::GetAtt: [CloudFormationExecutionRole, Arn]
