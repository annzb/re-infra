name: Test base image

# Runs the rc_lambda_base suites against LocalStack and smoke-tests the image that
# build.yml produced. Called by build.yml before anything is pushed to ECR.

on:
  workflow_call:
    inputs:
      artifact:
        description: Workflow artifact holding the built image tarball.
        required: true
        type: string
      image_tag:
        description: Tag the image carries inside that tarball.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact name (leave empty to run the suites only).
        required: false
        type: string
      image_tag:
        required: false
        type: string
        default: rc-lambda-base:ci

permissions:
  contents: read

jobs:
  test:
    name: Suites and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: images/lambda-base
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DYNAMO_SCHEMA_TEST_PREFIX: rc-ci-schema-sync-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv lock --check
          uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests (LocalStack)
        run: uv run pytest tests/integration

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: /tmp

      # The published image must contain the package and console scripts, and must not
      # contain the test tooling.
      - name: Smoke test the built image
        if: inputs.artifact != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker load --input /tmp/rc-lambda-base.tar
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            "import sys, rc_lambda_base, rc_lambda_base.dynamo.cli; assert sys.version_info[:2] == (3, 11)"
          docker run --rm --entrypoint rc-dynamo-sync "$IMAGE_TAG" --help
          docker run --rm --entrypoint rc-dynamo-report "$IMAGE_TAG" --help
          if docker run --rm --entrypoint python "$IMAGE_TAG" -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is installed in the published image"
            exit 1
          fi
