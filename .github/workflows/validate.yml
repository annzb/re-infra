name: Validate infrastructure

# Pull request checks for the rc-infra tool, the templates, and the catalog, plus the
# plan of what merging would change in AWS. Applies nothing: the plan role is denied
# executing change sets. Applying happens in deploy.yml, on main.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  checks:
    name: Lint, test, validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv lock --check
          uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy

      - name: Test
        run: uv run pytest

      - name: Validate templates and catalog
        run: |
          uv run cfn-lint infra/*.yaml
          uv run rc-infra validate

  plan:
    name: Infrastructure plan
    needs: checks
    # OIDC tokens are not issued to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RC_INFRA_CFN_ROLE_ARN: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fails the check when anything is BLOCKED; DELETE is highlighted at the top.
      - name: Plan
        run: uv run rc-infra plan --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
