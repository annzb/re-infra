AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Retribalize per-environment core resources (stack rc-env-<environment>):
  the durable buckets belonging to this environment. Deployed by
  `rc-infra apply`; do not deploy by hand.

# Conventions (rc-infra parses this file with yaml.safe_load):
#   - Long-form intrinsics only (Fn::Sub, Ref), never !Sub / !Ref.
#   - Every bucket is Retain. Deleting the stack never deletes data; rc-infra
#     empties and deletes preview buckets explicitly during teardown.
#   - No BucketName: CloudFormation generates rc-env-<environment>-<logical id>-<suffix>,
#     which teardown relies on. Callers read the names from the outputs below
#     (`rc-infra outputs`), never reconstruct them.
#   - DynamoDB tables are NOT declared here. rc-dynamo-sync (retribalize-core)
#     owns their creation and schema.
#   - Cognito is NOT declared here. The pools are shared by several environments
#     (all previews use one), so they belong to rc-identity. See infra/identity.md.
#   - No NotificationConfiguration on UserCorpusBucket. retribalize-core's
#     setup_corpus_triggers.py owns that bucket's notifications.

Resources:
  EmbeddingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  UserCorpusBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT]
            AllowedOrigins: ["*"]

  # The one public bucket. It serves avatars, project banners, user galleries, blog
  # covers and event photos straight to browsers through a bucket policy granting
  # s3:GetObject on those prefixes. The policy itself is NOT declared here: its
  # statement list differs per environment, and it is managed outside this template.
  #
  # Public access must therefore stay unblocked. Setting BlockPublicPolicy would
  # reject that policy and every image in the product would stop loading.
  AvatarsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, POST, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SchemaDumpsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSchemaDumps
            Status: Enabled
            ExpirationInDays: 30

  # Durable per-environment registry of property definitions. Versioned, because a
  # definition that is overwritten by mistake has to be recoverable.
  PropertyRegistryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600

Outputs:
  EmbeddingsBucketName:
    Value:
      Ref: EmbeddingsBucket
  EmbeddingsBucketArn:
    Value:
      Fn::GetAtt: [EmbeddingsBucket, Arn]
  UserCorpusBucketName:
    Value:
      Ref: UserCorpusBucket
  UserCorpusBucketArn:
    Value:
      Fn::GetAtt: [UserCorpusBucket, Arn]
  AvatarsBucketName:
    Value:
      Ref: AvatarsBucket
  AvatarsBucketArn:
    Value:
      Fn::GetAtt: [AvatarsBucket, Arn]
  RecordingsBucketName:
    Value:
      Ref: RecordingsBucket
  RecordingsBucketArn:
    Value:
      Fn::GetAtt: [RecordingsBucket, Arn]
  SchemaDumpsBucketName:
    Value:
      Ref: SchemaDumpsBucket
  SchemaDumpsBucketArn:
    Value:
      Fn::GetAtt: [SchemaDumpsBucket, Arn]
  PropertyRegistryBucketName:
    Value:
      Ref: PropertyRegistryBucket
  PropertyRegistryBucketArn:
    Value:
      Fn::GetAtt: [PropertyRegistryBucket, Arn]
