name: Build base images

# Builds the Lambda parent image, tests it, and publishes it only if those tests
# pass. Called by validate.yml; publishing is requested only for main.
#
#   build   -> image tarball as a workflow artifact (no AWS access)
#   test    -> suites against LocalStack + smoke tests on the built image
#   publish -> ECR build tag, vulnerability scan, latest, SSM digest
#
# Because the image travels between jobs as an artifact, an untested image can
# never reach ECR.

on:
  workflow_call:
    inputs:
      publish:
        description: Push the tested image to ECR. Only true for main.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-base-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ARTIFACT_NAME: rc-lambda-base-image
  IMAGE_TAG: rc-lambda-base:ci

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: images/lambda-base
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/rc-lambda-base.tar

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/rc-lambda-base.tar
          retention-days: 1
          compression-level: 0

  test:
    name: Test suites and image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: images/lambda-base
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DYNAMO_SCHEMA_TEST_PREFIX: rc-ci-schema-sync-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: |
          uv lock --check
          uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests (LocalStack)
        run: uv run pytest tests/integration

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp

      # The published image must hold the package and console scripts, and must not
      # hold the test tooling.
      - name: Smoke test the built image
        run: |
          docker load --input /tmp/rc-lambda-base.tar
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            "import sys, rc_lambda_base, rc_lambda_base.dynamo.cli; assert sys.version_info[:2] == (3, 11)"
          docker run --rm --entrypoint rc-dynamo-sync "$IMAGE_TAG" --help
          docker run --rm --entrypoint rc-dynamo-report "$IMAGE_TAG" --help
          if docker run --rm --entrypoint python "$IMAGE_TAG" -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is installed in the published image"
            exit 1
          fi

  publish:
    name: Publish to ECR
    needs: [build, test]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/rc-lambda-base.tar

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # Immutable: the repository rejects overwriting an existing build tag.
      - name: Push build tag
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          tag="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          repository="${REGISTRY}/rc-lambda-base"
          docker tag "$IMAGE_TAG" "${repository}:${tag}"
          docker push "${repository}:${tag}"
          digest=$(aws ecr describe-images --repository-name rc-lambda-base \
            --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "repository=$repository"
            echo "tag=$tag"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Scan
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          aws ecr wait image-scan-complete --repository-name rc-lambda-base \
            --image-id imageDigest="$DIGEST"
          critical=$(aws ecr describe-image-scan-findings --repository-name rc-lambda-base \
            --image-id imageDigest="$DIGEST" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          echo "CRITICAL findings: $critical"
          # Documented threshold: any CRITICAL finding fails the publish.
          if [ "$critical" != "None" ] && [ "$critical" != "0" ]; then
            echo "::error::$critical CRITICAL findings in rc-lambda-base@$DIGEST"
            exit 1
          fi

      - name: Move latest and publish the digest
        env:
          REPOSITORY: ${{ steps.push.outputs.repository }}
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker tag "$IMAGE_TAG" "${REPOSITORY}:latest"
          docker push "${REPOSITORY}:latest"
          aws ssm put-parameter --name /rc/lambda-base/image-uri --type String --overwrite \
            --value "${REPOSITORY}@${DIGEST}"
          {
            echo "## Lambda base image published"
            echo ""
            echo "- Build tag: \`${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin in retribalize-core: \`${REPOSITORY}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
